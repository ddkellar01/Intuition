name: Docker Publish
# Publishes straight to Docker Hub (login + build-push actions) --
# no GHCR, no publish script. Needs repo secrets:
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/intuition:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/intuition:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
